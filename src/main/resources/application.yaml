server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:10.212.10.135}:${DB_PORT:5432}/${DB_NAME:identity}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/identity-os

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: onboarding-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/onboarding/**

            - id: authentication-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/auth/**,/api/v1/organization/**